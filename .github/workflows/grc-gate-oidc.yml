# grc-gate-oidc: the production shape of the gate.
#
# Assumes an AWS role via GitHub OIDC, generates the Terraform plan in CI, and
# evaluates that. No stored AWS keys. The role is read-only.
#
# Week 4: evidence is bundled, hashed, and signed with Cosign keyless before the
# gate decision is enforced, so a failed run is preserved with the same custody
# guarantees as a passing one.
name: grc-gate-oidc

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::517353742262:role/github-actions-terraform-plan
  TF_VAR_project_name: grc-challenge
  TF_VAR_environment: dev
  TF_VAR_region: us-east-1

jobs:
  grc-gate-oidc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: grc-gate-${{ github.run_id }}

      - name: Confirm assumed identity
        run: aws sts get-caller-identity

      - name: Install Conftest
        env:
          CONFTEST_VERSION: 0.69.0
        run: |
          curl -sSfL \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            -o conftest.tar.gz
          tar -xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Generate plan
        working-directory: week-1
        run: |
          terraform init -input=false
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > "${GITHUB_WORKSPACE}/plan.json"

      - name: Run policy gate
        run: |
          mkdir -p week-3/evidence

          conftest test \
            --policy week-2/policies \
            --all-namespaces \
            --output json \
            plan.json \
            > week-3/evidence/conftest-results.json || true

          conftest test \
            --policy week-2/policies \
            --all-namespaces \
            plan.json || true

          cp plan.json week-3/evidence/plan.json

          FAILURES=$(jq '[.[].failures // [] | length] | add // 0' \
            week-3/evidence/conftest-results.json)

          echo "Total policy failures: ${FAILURES}"
          echo "POLICY_FAILURES=${FAILURES}" >> "${GITHUB_ENV}"

      - name: Install cosign
        if: always()
        uses: sigstore/cosign-installer@v3

      - name: Bundle, hash, and sign evidence
        if: always()
        run: |
          set -euo pipefail
          tar -czf evidence.tar.gz -C week-3 evidence
          sha256sum evidence.tar.gz > evidence.tar.gz.sha256
          cosign sign-blob --yes \
            --bundle evidence.sig.bundle \
            evidence.tar.gz
          cat evidence.tar.gz.sha256

      - name: Upload signed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grc-gate-oidc-evidence
          path: |
            evidence.tar.gz
            evidence.tar.gz.sha256
            evidence.sig.bundle
          if-no-files-found: warn

      - name: Enforce policy gate
        if: always()
        run: |
          if [ -z "${POLICY_FAILURES:-}" ]; then
            echo "::error::Gate did not run to completion."
            exit 1
          fi
          if [ "${POLICY_FAILURES}" -gt 0 ]; then
            echo "::error::Policy gate failed with ${POLICY_FAILURES} violation(s)."
            exit 1
          fi
          echo "Policy gate passed."
